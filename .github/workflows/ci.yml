name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend (bun build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build (tsc + vite)
        run: bun run build

  build:
    name: build (${{ matrix.os }})
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install JS dependencies
        run: bun install --frozen-lockfile
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: cargo fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Build Tauri bundle — Linux/macOS
        if: runner.os != 'Windows'
        run: bun run tauri build
        env:
          CI: true
      - name: Build Tauri bundle — Windows (dynamic ONNX Runtime to avoid CRT mismatch)
        if: runner.os == 'Windows'
        # ort's static CRT (MD) vs esaxx/onig's MT causes LNK2038 on Windows.
        # Context7 /ort docs: `load-dynamic` disables linking (`disable-linking`), avoids static CRT.
        run: bun run tauri build -- --features load-dynamic
        env:
          CI: true
      - name: Upload Tauri bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: gemma-on-device-${{ matrix.os }}
          # `tauri build` emits bundles to the workspace-root `target/`, not `src-tauri/target/`
          # (the workspace is declared in the root `Cargo.toml`).
          path: target/release/bundle
          retention-days: 7
          if-no-files-found: error
