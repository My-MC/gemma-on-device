name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider-features:
    name: provider features (${{ matrix.os }}, ${{ matrix.feature }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            feature: desktop-cuda
          - os: ubuntu-latest
            feature: desktop-migraphx
          - os: windows-latest
            feature: desktop-cuda
          - os: macos-latest
            feature: desktop-coreml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v6
        if: runner.os != 'Windows'
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
        if: runner.os == 'Windows'
        with:
          bun-version: "1.3.14"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: ${{ matrix.feature }}
      - name: Stage onnxruntime.dll (Windows)
        if: runner.os == 'Windows'
        run: bun scripts/download_ort_dll.ts --force
      - name: Check edition feature
        run: cargo check --manifest-path src-tauri/Cargo.toml --features ${{ matrix.feature }}
      - name: Clippy edition feature
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --features ${{ matrix.feature }} -- -D warnings

  desktop-editions:
    name: edition bundle (${{ matrix.edition }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            edition: cuda
          - os: ubuntu-latest
            edition: migraphx
          - os: windows-latest
            edition: cuda
          - os: macos-latest
            edition: coreml
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Free space for bundled GPU runtimes
        if: runner.os == 'Linux'
        run: |
          sudo python3 scripts/ensure_ci_disk_space.py --edition '${{ matrix.edition }}'
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install MIGraphX runtime dependencies
        if: matrix.edition == 'migraphx'
        run: |
          wget -q https://repo.radeon.com/rocm/rocm.gpg.key -O /tmp/rocm.gpg.key
          gpg --dearmor < /tmp/rocm.gpg.key | sudo tee /usr/share/keyrings/rocm.gpg > /dev/null
          echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/7.2.1 noble main' | sudo tee /etc/apt/sources.list.d/rocm.list
          printf 'Package: *\nPin: origin repo.radeon.com\nPin-Priority: 600\n' | sudo tee /etc/apt/preferences.d/rocm
          sudo apt-get update
          sudo apt-get install -y migraphx migraphx-dev hip-dev hipcc ninja-build patch
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test runtime preparation
        run: python -m unittest discover -s scripts -p test_prepare_runtime.py
      - name: Install MIGraphX build tools
        if: matrix.edition == 'migraphx'
        run: python -m pip install 'cmake==4.2.3'
      - name: Install JS dependencies
        run: bun install --frozen-lockfile
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: ${{ matrix.edition }}
      - name: Cache pinned runtime downloads
        uses: actions/cache@v6
        with:
          path: .cache/runtime-wheels/downloads
          key: runtime-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.edition }}-${{ hashFiles('scripts/runtime_lock.json') }}
      - name: Identify MIGraphX build environment
        if: matrix.edition == 'migraphx'
        id: migraphx-build
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shlex, subprocess
          lock = json.loads(pathlib.Path('scripts/runtime_lock.json').read_text())
          packages = subprocess.check_output(['dpkg-query', '-W', '-f=${binary:Package}=${Version}\n'], text=True)
          environment = {
              'cmake': subprocess.check_output(['cmake', '--version'], text=True),
              'compiler': subprocess.check_output([*shlex.split(os.environ.get('CXX') or 'c++'), '--version'], text=True),
              'c_compiler': subprocess.check_output([*shlex.split(os.environ.get('CC') or 'cc'), '--version'], text=True),
              'flags': {name: os.environ.get(name, '') for name in ('CC', 'CXX', 'CFLAGS', 'CXXFLAGS', 'LDFLAGS')},
              'packages': sorted(line for line in packages.splitlines() if line.startswith(('migraphx', 'hip', 'rocm', 'hsa-rocr', 'comgr', 'rocblas', 'miopen'))),
          }
          inputs = {name: lock[name] for name in ('ort', 'rocm_version', 'migraphx_plugin')}
          inputs['spec'] = json.loads(pathlib.Path('scripts/migraphx_build_spec.json').read_text())
          inputs['patches'] = {str(path): hashlib.sha256(path.read_bytes()).hexdigest() for path in sorted(pathlib.Path('scripts/patches').glob('migraphx*'))}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for name, value in (('identity', environment), ('inputs', inputs)):
                  output.write(f'{name}={hashlib.sha256(json.dumps(value, sort_keys=True).encode()).hexdigest()}\n')
          PY
      - name: Cache compiled MIGraphX plugin
        if: matrix.edition == 'migraphx'
        uses: actions/cache@v6
        with:
          path: .cache/runtime-wheels/migraphx-plugin-cache
          key: migraphx-plugin-v2-${{ matrix.os }}-${{ runner.arch }}-${{ steps.migraphx-build.outputs.identity }}-${{ steps.migraphx-build.outputs.inputs }}
      - name: Build edition bundle
        run: bun run tauri:${{ matrix.edition }}
        env:
          CI: true
          ROCM_PATH: /opt/rocm
          GEMMA_MIGRAPHX_BUILD_ID: ${{ steps.migraphx-build.outputs.identity }}
      - name: Verify MIGraphX plugin ABI and CPU execution
        if: matrix.edition == 'migraphx'
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --features desktop-migraphx migraphx_plugin_runtime_smoke -- --ignored
        env:
          GEMMA_PLUGIN_TEST_RUNTIME: ${{ github.workspace }}/target/release/ort-runtime
      - name: Verify AMD installer system dependencies
        if: matrix.edition == 'migraphx'
        run: |
          python - <<'PY'
          import pathlib, subprocess
          bundles = list(pathlib.Path('target/release/bundle/deb').glob('*.deb'))
          assert bundles, 'MIGraphX deb is missing'
          for bundle in bundles:
              dependencies = subprocess.check_output(['dpkg-deb', '--field', str(bundle), 'Depends'], text=True)
              for required in ('libnuma1', 'libdrm-amdgpu1', 'libelf1', 'libwebkit2gtk-4.1-0'):
                  assert required in dependencies, f'{bundle} is missing {required}'
          PY
      - name: Verify CPU fallback without GPU plugins
        if: matrix.edition == 'migraphx'
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --features desktop-migraphx migraphx_unavailable_falls_back_to_cpu -- --ignored
        env:
          ORT_DYLIB_PATH: ${{ github.workspace }}/target/release/ort-runtime/libonnxruntime.so
      - name: Upload edition bundle
        uses: actions/upload-artifact@v7
        with:
          name: gemma-on-device-${{ matrix.edition }}-${{ matrix.os }}-${{ runner.arch }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  frontend:
    name: frontend (Biome + bun build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check lint, formatting, and imports (Biome)
        run: bun run check:ci
      - name: Test runtime cache validation
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build (tsc + vite)
        run: bun run build

  build:
    name: build (${{ matrix.os }})
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install JS dependencies
        run: bun install --frozen-lockfile
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      # Cache restoration can replace target/release; stage the verified DLL after it.
      - name: Stage onnxruntime.dll (Windows)
        if: runner.os == 'Windows'
        run: bun scripts/download_ort_dll.ts --force
      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: cargo fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Build Tauri bundle — Linux/macOS
        if: runner.os != 'Windows'
        run: bun run tauri:desktop
        env:
          CI: true
      - name: Build Tauri bundle — Windows (dynamic ONNX Runtime to avoid CRT mismatch)
        if: runner.os == 'Windows'
        # ort's static CRT (MD) vs esaxx/onig's MT causes LNK2038 on Windows.
        # Context7 /ort docs: `load-dynamic` disables linking (`disable-linking`), avoids static CRT.
        run: bun run tauri build -- --features load-dynamic
        env:
          CI: true
          GEMMA_CARGO_FEATURES: load-dynamic
      - name: Upload Tauri bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: gemma-on-device-${{ matrix.os }}
          # Upload installers only, excluding expanded bundle staging directories.
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  android-signing:
    name: Check Android signing configuration
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check required secrets
        id: check
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [[ -n "$ANDROID_KEY_BASE64" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" && -n "$ANDROID_STORE_PASSWORD" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Android signing secrets are configured." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Android signing secrets are unavailable; building unsigned APK/AAB packages. Configure ANDROID_KEY_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, and ANDROID_STORE_PASSWORD to produce signed packages." >> "$GITHUB_STEP_SUMMARY"
          fi

  android:
    name: Android (APK and AAB)
    needs: [frontend, android-signing]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install Android NDK
        run: |
          sdkmanager "platforms;android-37.0"
          if [[ ! -e "$ANDROID_HOME/platforms/android-37" ]]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install JS dependencies
        run: bun install --frozen-lockfile
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Initialize Android project
        run: bun run tauri android init --ci
      - name: Configure Android release signing
        if: needs.android-signing.outputs.enabled == 'true'
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.jks"
          {
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'password=%s\n' "$ANDROID_STORE_PASSWORD"
            printf 'storeFile=%s\n' "$RUNNER_TEMP/android-release.jks"
          } > src-tauri/gen/android/keystore.properties
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src-tauri/gen/android/app/build.gradle.kts")
          source = path.read_text()
          android_block = "android {\n"
          release_block = '        getByName("release") {\n'
          if android_block not in source or release_block not in source:
              raise SystemExit(f"Android Gradle signing blocks not found in {path}")
          signing = '''val keystorePropertiesFile = rootProject.file("keystore.properties")
          val keystoreProperties = java.util.Properties().apply {
              keystorePropertiesFile.inputStream().use { load(it) }
          }

          android {
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["password"] as String
                  }
              }
          '''
          source = source.replace(android_block, signing, 1)
          source = source.replace(
              release_block,
              release_block + '            signingConfig = signingConfigs.getByName("release")\n',
              1,
          )
          path.write_text(source)
          PY
      - name: Build Android APK and AAB
        run: bun run tauri android build --ci --target aarch64 --features nnapi --apk --aab
      - name: Upload Android packages
        uses: actions/upload-artifact@v7
        with:
          name: gemma-on-device-android
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          retention-days: 7
          if-no-files-found: error

  ios:
    name: iOS (AltStore Classic unsigned IPA)
    needs: frontend
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Install iOS project tools
        run: brew install xcodegen libimobiledevice cocoapods
      - name: Install JS dependencies
        run: bun install --frozen-lockfile
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Initialize iOS project
        run: bun run tauri ios init --ci
      - name: Build unsigned iOS IPA for AltStore Classic
        run: bun run tauri ios build --ci --target aarch64 --features coreml --no-sign
      - name: Upload iOS IPA
        uses: actions/upload-artifact@v7
        with:
          name: gemma-on-device-ios-altstore-classic
          path: src-tauri/gen/apple/build/arm64/*.ipa
          retention-days: 7
          if-no-files-found: error
