name: sccache benchmark

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/sccache-benchmark.yml
      - scripts/benchmark_sccache.py

permissions:
  contents: read

concurrency:
  group: sccache-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Match the production job ID and edition key to restore its Cargo cache.
  desktop-editions:
    name: Compare sccache (${{ matrix.edition }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            edition: migraphx
          - os: windows-latest
            edition: cuda
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install JS dependencies
        run: bun install --frozen-lockfile
      - name: Restore production Cargo cache without updating it
        id: cargo-cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: ${{ matrix.edition }}
          save-if: "false"
      - name: Prepare frontend
        run: bun run build
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.18.0"
      - name: Compare Rust Release builds with the restored Cargo cache
        run: python scripts/benchmark_sccache.py ${{ matrix.edition }}
        env:
          SCCACHE_GHA_ENABLED: "true"
          SCCACHE_GHA_VERSION: benchmark-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.edition }}
          BENCHMARK_CARGO_CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
      - name: Upload benchmark logs and measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sccache-benchmark-${{ matrix.os }}-${{ matrix.edition }}
          path: benchmark-results/sccache/
          if-no-files-found: error
          retention-days: 7
