name: Windows compression benchmark

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/windows-compression-benchmark.yml
      - scripts/benchmark_windows_compression.py

permissions:
  contents: read

jobs:
  compare:
    name: Compare ${{ matrix.format }} compression
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        format: [msi, nsis]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: bun install --frozen-lockfile
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: cuda
          save-if: false
      - uses: actions/cache/restore@v6
        with:
          path: .cache/runtime-wheels/downloads
          key: runtime-downloads-v1-${{ runner.os }}-${{ runner.arch }}-cuda-${{ hashFiles('scripts/runtime_lock.json') }}
      - name: Build shared CUDA application without installers
        run: bun scripts/build_tauri_edition.ts cuda --no-bundle
        env:
          CI: true
      - name: Bundle compressed
        run: python scripts/benchmark_windows_compression.py ${{ matrix.format }} compressed
        env:
          GEMMA_RUNTIME_EDITION: cuda
      - name: Upload compressed
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-${{ matrix.format }}-compressed-${{ github.run_id }}
          path: target/compression-benchmark/${{ matrix.format }}-compressed/*
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Remove uploaded compressed installer
        env:
          BENCHMARK_FORMAT: ${{ matrix.format }}
        run: |
          $path = "target/compression-benchmark/{0}-compressed" -f $env:BENCHMARK_FORMAT
          Remove-Item -Recurse -Force $path
      - name: Bundle uncompressed
        id: uncompressed
        continue-on-error: true
        run: python scripts/benchmark_windows_compression.py ${{ matrix.format }} none
        env:
          GEMMA_RUNTIME_EDITION: cuda
      - name: Upload uncompressed
        if: steps.uncompressed.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-${{ matrix.format }}-none-${{ github.run_id }}
          path: target/compression-benchmark/${{ matrix.format }}-none/*
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Upload measurement records
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-${{ matrix.format }}-measurements-${{ github.run_id }}
          path: target/compression-benchmark/*-result.json
          retention-days: 7
