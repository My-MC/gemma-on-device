[package]
name = "gemma-on-device"
version = "0.1.0"
description = "Gemma on-device inference with ort + Tauri (Bun + React) - multi-platform validation"
authors = ["you"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "gemma_on_device_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minijinja = { version = "2", features = ["json", "fuel"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
sha1 = "0.10"
prost = "0.14"
anyhow = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
# HTTP download for on-device model fetching (uses rustls to avoid extra openssl deps)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio-util = { version = "0.7", features = ["io"] }
# ONNX Runtime wrapper - CPU default, GPU builds load a pinned runtime at runtime.
ort = { version = "2.0.0-rc.13", features = ["half"] }
# Tokenizer for Gemma (SentencePiece)
tokenizers = { version = "0.23", features = [] }
ndarray = "0.17"
sha2 = "0.11"
hex = "0.4"
rand = "0.10"
half = "2.3"
chrono = { version = "0.4", features = ["serde"] }

[features]
default = []
# Execution Providers - enable per target
cuda = ["ort/cuda", "load-dynamic"]
migraphx = ["load-dynamic"]
webgpu = []
desktop-cuda = ["cuda", "webgpu"]
desktop-coreml = ["coreml", "webgpu"]
desktop-migraphx = ["migraphx", "webgpu"]
tensorrt = ["ort/tensorrt"]
coreml = ["ort/coreml", "load-dynamic"]
directml = ["ort/directml"]
nnapi = ["ort/nnapi"]
xnnpack = ["ort/xnnpack"]
# Dynamic loading of ONNX Runtime (avoids static linking, fixes Windows CRT mismatch)
load-dynamic = ["ort/load-dynamic"]

# Desktop runtime editions are mutually exclusive: each is packaged with a
# matching ONNX Runtime binary and its provider dependencies.
